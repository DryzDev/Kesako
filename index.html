    const a=Math.random()*6.28,d=(big?90:50)+Math.random()*(big?200:90);
    p.animate([{transform:`translate(${x}px,${y}px) scale(1)`,opacity:1},{transform:`translate(${x+Math.cos(a)*d}px,${y+Math.sin(a)*d+60}px) scale(.2)`,opacity:0}],{duration:900+Math.random()*500,easing:"cubic-bezier(.1,.7,.3,1)"}).onfinish=()=>p.remove()}
}
async function initSample(){try{if(window.claude&&claude.use)sample=await claude.use("sample")}catch(e){sample=null}}
async function refill(){
  if(!sample||filling>=2||queue.length+filling*5>=15)return;filling++;
  const ls=sh("ABCDEFGHIJLMNOPQRSTUVZ".split("")).slice(0,5).join(", ");
  const p=`Tu es lexicographe. Choisis 5 mots DIFFÉRENTS issus du dictionnaire de la langue française (Larousse, Robert, Académie française) : mots réels et attestés, de niveau moyen à difficile, variés (noms, verbes, adjectifs), commençant respectivement par les lettres : ${ls}. Évite ces mots déjà vus : ${used.slice(-60).join(", ")||"aucun"}.
Pour chaque mot fournis : "mot" (orthographe exacte), "nature" (ex : nom féminin, verbe, adjectif), "vraie" (définition exacte du dictionnaire, reformulée, une phrase très courte de 12 mots maximum, sans citer le mot), "fausses" (tableau de 2 définitions fausses mais très crédibles, de même style et longueur que la vraie), "absurde" (une définition fausse, nettement absurde et drôle, rédigée comme une vraie définition).
Réponds UNIQUEMENT par un tableau JSON : [{"mot":"","nature":"","vraie":"","fausses":["",""],"absurde":""}]`;
  try{const r=await sample.json(p,{modelTier:"quick",cache:false});
    (Array.isArray(r)?r:[]).forEach(w=>{if(w&&w.mot&&w.vraie&&Array.isArray(w.fausses)&&w.fausses.length>=2&&w.absurde&&!used.includes(w.mot)&&!queue.some(q=>q.mot===w.mot))queue.push(w)});
  }catch(e){if(e&&e.code==="not_granted")sample=null}
  filling--;
}
async function getWord(maxWait){
  if(queue.length){const w=queue.shift();refill();return w}
  if(sample){const t=Date.now();refill();
    while(Date.now()-t<maxWait){if(queue.length){const w=queue.shift();refill();return w}if(!filling)break;await sleep(150)}}
  const pool=W.filter(w=>!used.includes(w.mot));return sh(pool.length?pool:W)[0];
}

  if(first)$("inner").classList.remove("in");
  else{const t=$("turner"),c=$("inner").cloneNode(true);c.removeAttribute("id");c.querySelectorAll("[id]").forEach(e=>e.removeAttribute("id"));c.className="";c.style.cssText="opacity:1;transform:none";t.innerHTML="";t.appendChild(c);t.classList.remove("hidden");if(t._a)t._a.cancel();t._a=t.animate([{transform:"rotateY(0deg)",opacity:1},{opacity:1,offset:.9},{transform:"rotateY(-180deg)",opacity:0}],{duration:1050,easing:"cubic-bezier(.45,.05,.3,1)",fill:"both"});Mus.flip(.05,.9)}

  $("mot").innerHTML="";[...w.mot].forEach((c,i)=>{const s=document.createElement("span");s.textContent=c===" "?"\u00a0":c;s.style.setProperty("--i",i);$("mot").appendChild(s)});

  const my=tok;$("nx").onclick=()=>show(false,my);$("nx").scrollIntoView({block:"nearest",behavior:"smooth"});
}
